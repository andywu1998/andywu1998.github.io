name: Beautiful Jekyll CI
on: [push, pull_request]
jobs:
  build:
    name: Build Jekyll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build the site
        run: |
          set -o pipefail
          bundle exec jekyll build --future --trace 2>&1 | tee /tmp/jekyll-build.log
      - name: Report build error
        if: failure()
        run: |
          MSG=$(tail -n 50 /tmp/jekyll-build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Jekyll build failed::$MSG"
